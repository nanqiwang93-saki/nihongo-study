    if(['low','normal','high'].includes(candidate.energy))d.energy=candidate.energy;

  <div class="card"><div class="card-heading"><h2 class="card-title">最近一次模拟</h2></div>${last?`<div class="eyebrow">${escapeHTML(last.level)} · ${escapeHTML(last.date)}</div><div class="stat-value" style="font-size:40px">${last.lang+last.read+last.listen}<small>/180</small></div><div class="flex" style="margin:15px 0"><span class="pill ${pass(last)?'green':'orange'}">${pass(last)?'参考标准达标':'尚未达到参考标准'}</span></div>${[['语言知识',last.lang],['阅读',last.read],['听力',last.listen]].map(([t,v])=>`<div class="progress-row"><div class="progress-title"><span>${t}</span><span>${v}/60</span></div>${bar(v/60*100)}</div>`).join('')}`:`<div class="empty"><span class="empty-icon">◎</span>还没有模拟成绩。<br>基础阶段先学教材，不需要急着刷 N2 真题。</div>`}</div>
  <div class="card full-width"><div class="card-heading"><h2 class="card-title">模拟成绩历史</h2></div>${es.length?`<div class="table-wrap"><table class="score-table"><thead><tr><th>日期</th><th>等级</th><th>语言知识</th><th>阅读</th><th>听力</th><th>总分</th><th>参考判断</th><th></th></tr></thead><tbody>${es.map(x=>`<tr><td>${escapeHTML(x.date)}</td><td>${x.level}</td><td>${x.lang}</td><td>${x.read}</td><td>${x.listen}</td><td><b>${x.lang+x.read+x.listen}</b></td><td><span class="pill ${pass(x)?'green':'orange'}">${pass(x)?'达标':'未达标'}</span></td><td><button class="text-link" data-action="delete-exam" data-id="${escapeHTML(x.id)}">删除</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">完成一套标准化模拟卷后，再在这里登记结果。</div>'}<div class="notice"><span>i</span><div>仅按 JLPT 公布的 N2（总分≥90）/ N3（总分≥95）、各得分区≥19 的合格线作学习参考；不代表真实考试通过，也不能用普通练习册的原始分数预测 JLPT 正式尺度得分。</div></div></div></div>`;}
  function settingsPage(){return `${heading('PREFERENCES & BACKUP','设置与备份','本机保留学习记录；登录后可以同步到云端。建议定期下载备份。')}
  <div class="card"><div class="setting-block"><div><h3>JLPT 目标考试窗口</h3><p>7 月作为冲刺窗口，12 月作为稳妥备选。2027 年正式考试日期以官方公告为准。</p></div><select id="goal-select" aria-label="考试目标月份"><option value="2027-07" ${state.goal==='2027-07'?'selected':''}>2027 年 7 月 · 冲刺</option><option value="2027-12" ${state.goal==='2027-12'?'selected':''}>2027 年 12 月 · 备选</option></select></div>
  <div class="setting-block"><div><h3>导出学习记录</h3><p>下载包含教材状态、复习卡、学习日志、模拟成绩和今日任务的 JSON 备份文件。可以存放在电脑、网盘或 U 盘。</p></div><button class="button secondary" data-action="export">下载 JSON 备份 ↓</button></div>
  <div class="setting-block"><div><h3>从备份恢复</h3><p>导入此前导出的 JSON 文件。注意：导入会替换当前全部学习记录。请在导入前先导出当前备份。</p></div><button class="button secondary" data-action="import">选择备份文件 ↑</button></div>
  <div class="setting-block"><div><h3>清空所有记录</h3><p>会删除当前的学习记录；登录并连接云端时，清空也可能同步到其他设备。请先导出备份。</p></div><button class="button danger" data-action="reset">清空记录</button></div></div>
  <div class="notice"><span>⌁</span><div><b>关于存储：</b>学习数据先保存在浏览器中。点击右上角「云同步」登录后，可把数据同步至 Firebase；若显示「云端失败」，只代表本机已经保存。更换设备时使用同一邮箱登录。本站不会自动把记录传给 ChatGPT，请定期导出备份。</div></div>`;}
  function render(){root.innerHTML=({home,path:lessonsPage,review:reviewPage,logs:logsPage,exams:examsPage,settings:settingsPage}[page]||home)();updateChrome();}
  function handleLessonStatus(id,value){if(!lessonIndex[id])return;let before=state.lessons[id]||0;let next=Math.round(num(value,0,3));state.lessons[id]=next;const cardId='lesson:'+id;let existing=state.cards.find(x=>x.id===cardId);if(next>=2 && before<2){if(!existing){state.cards.push({id:cardId,title:lessonIndex[id].name,source:lessonIndex[id].unit,note:'合上纸质教材，尝试复述这一课的知识点。',next:addDays(today(),1),step:0,archived:false});}else{existing.archived=false;existing.step=0;existing.next=addDays(today(),1);}}if(next<2&&existing)existing.archived=true;save();render();toast(next>=2&&before<2?'已更新状态，并加入复习计划':'教材进度已保存');}
  function exportData(){const out=JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2);const url=URL.createObjectURL(new Blob([out],{type:'application/json;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=`nihongo-journey-backup-${today()}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('备份文件已生成');}
  function processImport(file){if(!file)return;if(file.size>5*1024*1024){toast('备份文件过大，最多支持 5 MB');return;}const reader=new FileReader();reader.onload=()=>{try{const next=safeState(JSON.parse(String(reader.result)));if(!confirm('导入会替换全部现有记录，确定继续吗？'))return;state=next;save();navigate('home');toast('备份导入成功');}catch(e){toast('导入失败：'+e.message);}};reader.readAsText(file);}
  document.addEventListener('click',event=>{
    const navBtn=event.target.closest('[data-page]');if(navBtn){navigate(navBtn.dataset.page);return;}
    const btn=event.target.closest('button[data-action]');if(!btn)return;
    const {action,id,value}=btn.dataset;
    if(action==='energy'){state.energy=value;state.taskDays[today()]=snapshotTasks(value);save();render();toast('已切换为新的弹性任务');}
    if(action==='regenerate'){state.taskDays[today()]=snapshotTasks(state.energy);save();render();toast('已按当前精力重新生成任务');}
    if(action==='review-again'||action==='review-good'){const card=state.cards.find(x=>x.id===id);if(!card)return;if(action==='review-again'){card.step=0;card.next=addDays(today(),1);}else{card.step=Math.min(4,card.step+1);card.next=addDays(today(),INTERVALS[card.step]);}save();render();toast('复习结果已保存');}
    if(action==='review-archive'){const card=state.cards.find(x=>x.id===id);if(card){card.archived=true;save();render();toast('已归档复习卡');}}
    if(action==='delete-log'){if(confirm('确定删除这条学习记录吗？')){state.logs=state.logs.filter(x=>x.id!==id);save();render();}}
    if(action==='delete-exam'){if(confirm('确定删除这条模拟成绩吗？')){state.exams=state.exams.filter(x=>x.id!==id);save();render();}}
    if(action==='export')exportData();
    if(action==='import')$('#file-import').click();
    if(action==='reset'){if(confirm('最后确认：清空所有学习记录？此操作无法撤销。')){state=defaultState();save();navigate('home');toast('已清空记录');}}
  });
  document.addEventListener('change',event=>{
    const t=event.target;
    if(t.matches('[data-action="lesson-status"]'))handleLessonStatus(t.dataset.id,t.value);
    if(t.matches('[data-action="task"]')){const tasks=getTodayTasks();const i=Number(t.dataset.index);if(tasks.items[i]){tasks.items[i].done=t.checked;save();render();}}
    if(t.matches('#goal-select')){state.goal=t.value;save();toast('目标考试窗口已更新');}
    if(t.matches('#file-import')){processImport(t.files[0]);t.value='';}
  });
  document.addEventListener('submit',event=>{
    const form=event.target;if(!['log-form','review-form','exam-form'].includes(form.id))return;event.preventDefault();if(!form.reportValidity())return;const fd=new FormData(form);
    if(form.id==='log-form'){const dt=String(fd.get('date'));const m=Number(fd.get('minutes'));if(!/^\d{4}-\d{2}-\d{2}$/.test(dt)||dt>today()||!(m>=1&&m<=600)){toast('请填写有效日期与 1～600 分钟的时长');return;}state.logs.push({id:uid(),date:dt,minutes:Math.round(m),kind:String(fd.get('kind')||'其他'),topic:String(fd.get('topic')||'').trim().slice(0,200),note:String(fd.get('note')||'').trim().slice(0,2000)});save();render();toast('学习日志已保存');}
    if(form.id==='review-form'){const title=String(fd.get('title')||'').trim();if(!title){toast('请填写复习主题');return;}state.cards.push({id:uid(),title:title.slice(0,120),source:'自定义复习',note:String(fd.get('note')||'').trim().slice(0,2000),next:addDays(today(),1),step:0,archived:false});save();render();toast('复习卡已添加');}
    if(form.id==='exam-form'){const level=String(fd.get('level'));const date=String(fd.get('date'));const items=['lang','read','listen'].map(x=>Number(fd.get(x)));if(!['N2','N3'].includes(level)||date>today()||items.some(x=>!Number.isInteger(x)||x<0||x>60)){toast('三科分数均应为 0～60 的整数');return;}state.exams.push({id:uid(),date,level,lang:items[0],read:items[1],listen:items[2]});save();render();toast('模拟成绩已保存');}
  });
  window.NihongoBridge={read:()=>JSON.parse(JSON.stringify(state)),replace:data=>{state=safeState(data);save();render();},backup:exportData};
  const dateObj=new Date();$('#today-text').textContent=`${dateObj.getFullYear()} 年 ${dateObj.getMonth()+1} 月 ${dateObj.getDate()} 日`;
  render();
})();

</script>
<script type="module" src="./cloud-sync.js"></script>
</body>
